name: Build development image

on:
  pull_request:
    paths:
      - containers/dev/**
      - tests/smoke-dev-container.sh
      - .github/workflows/dev-image.yml
  push:
    branches: [main]
    paths:
      - containers/dev/**
      - tests/smoke-dev-container.sh
      - .github/workflows/dev-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept in one place so the build and manifest jobs agree.
  IMAGE_NAME: developer-platform-dev

jobs:
  build:
    # One native runner per architecture. Emulating aarch64 would make the
    # dnf and npm steps unreasonably slow, and free arm64 runners are
    # available to public repositories.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      #- name: Require a pinned Claude Code version
      #  env:
      #    CLAUDE_VERSION: ${{ vars.CLAUDE_CODE_VERSION }}
      #  run: test -n "$CLAUDE_VERSION"

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Set image name
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${OWNER}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          podman build \
            --platform "linux/${{ matrix.arch }}" \
            --tag "$IMAGE:${GITHUB_SHA}-${{ matrix.arch }}" \
            containers/dev

      #  env:
      #    CLAUDE_VERSION: ${{ vars.CLAUDE_CODE_VERSION }}
      #      --build-arg "CLAUDE_CODE_VERSION=$CLAUDE_VERSION" \

      - name: Smoke test
        run: |
          podman run --rm \
            --volume "$PWD/tests:/tests:ro" \
            "$IMAGE:${GITHUB_SHA}-${{ matrix.arch }}" \
            bash /tests/smoke-dev-container.sh

      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" |
            podman login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Publish architecture image
        if: github.event_name != 'pull_request'
        run: |
          podman push "$IMAGE:${GITHUB_SHA}-${{ matrix.arch }}"

  manifest:
    # Joins the per-architecture images published above into a single
    # multi-arch manifest, so `podman pull` picks the right one.
    name: publish manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Set image name
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${OWNER}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" |
            podman login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Assemble manifest
        run: |
          podman manifest create "$IMAGE:${GITHUB_SHA}"

          for arch in amd64 arm64; do
            podman manifest add \
              "$IMAGE:${GITHUB_SHA}" \
              "docker://$IMAGE:${GITHUB_SHA}-${arch}"
          done

      - name: Publish
        run: |
          podman manifest push --all \
            "$IMAGE:${GITHUB_SHA}" "docker://$IMAGE:${GITHUB_SHA}"

          podman manifest push --all \
            "$IMAGE:${GITHUB_SHA}" "docker://$IMAGE:main"
