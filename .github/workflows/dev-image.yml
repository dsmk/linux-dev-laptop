---
name: Build development images

# Builds every flavour in containers/flavours.conf, for every architecture
# that file lists:
#
#   toolbx     -> ghcr.io/<owner>/developer-platform-dev
#   distrobox  -> ghcr.io/<owner>/developer-platform-distrobox
#   ticrypt    -> ghcr.io/<owner>/developer-platform-ticrypt
#
# A pull request builds and smoke tests every image and publishes nothing.
# A push to main publishes per-architecture tags and a multi-arch manifest.
#
# The matrices come from containers/flavours.conf by way of
# containers/ci-matrix.sh, so adding a flavour there is enough to get it
# built and published; this file does not list them. Everything goes through
# containers/build.sh so a local build and a CI build take the same path.

on:
  pull_request:
    paths:
      - containers/**
      - tests/**
      - .github/workflows/dev-image.yml
  push:
    branches: [main]
    paths:
      - containers/**
      - tests/**
      - .github/workflows/dev-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: resolve flavours
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.generate.outputs.build }}
      manifest: ${{ steps.generate.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4

      - id: generate
        run: |
          {
            echo "build=$(containers/ci-matrix.sh --build)"
            echo "manifest=$(containers/ci-matrix.sh --manifest)"
          } >> "$GITHUB_OUTPUT"

          echo "Building:"
          containers/ci-matrix.sh --build

  build:
    name: build (${{ matrix.flavor }}, ${{ matrix.arch }})
    needs: matrix
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.build) }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Set image name
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${OWNER}/${{ matrix.image }}" >> "$GITHUB_ENV"

      # build.sh checks the toolbx label on the result and then runs
      # tests/smoke-container.sh inside it, with the package lists and kind
      # taken from containers/flavours.conf.
      - name: Build and smoke test
        run: |
          containers/build.sh \
            --engine podman \
            --flavor "${{ matrix.flavor }}" \
            --arch "${{ matrix.arch }}" \
            --tag "$IMAGE:${GITHUB_SHA}-${{ matrix.arch }}" \
            --smoke

      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" |
            podman login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Publish architecture image
        if: github.event_name != 'pull_request'
        run: |
          podman push "$IMAGE:${GITHUB_SHA}-${{ matrix.arch }}"

  manifest:
    # Joins the per-architecture images published above into one multi-arch
    # manifest per flavour, so `podman pull` picks the right one. A flavour
    # built for a single architecture still gets a manifest, so that every
    # flavour is consumed the same way.
    name: publish manifest (${{ matrix.flavor }})
    needs: [matrix, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.manifest) }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Set image name
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${OWNER}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" |
            podman login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Assemble manifest
        run: |
          podman manifest create "$IMAGE:${GITHUB_SHA}"

          for arch in ${{ matrix.arches }}; do
            podman manifest add \
              "$IMAGE:${GITHUB_SHA}" \
              "docker://$IMAGE:${GITHUB_SHA}-${arch}"
          done

      - name: Publish
        run: |
          podman manifest push --all \
            "$IMAGE:${GITHUB_SHA}" "docker://$IMAGE:${GITHUB_SHA}"

          podman manifest push --all \
            "$IMAGE:${GITHUB_SHA}" "docker://$IMAGE:main"
