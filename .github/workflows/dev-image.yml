---
name: Build development images

# Builds both image flavours for both architectures:
#
#   toolbx     -> ghcr.io/<owner>/developer-platform-dev
#   distrobox  -> ghcr.io/<owner>/developer-platform-distrobox
#
# Everything goes through containers/build.sh so that a local build and a CI
# build take exactly the same path.

on:
  pull_request:
    paths:
      - containers/**
      - tests/**
      - .github/workflows/dev-image.yml
  push:
    branches: [main]
    paths:
      - containers/**
      - tests/**
      - .github/workflows/dev-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # One native runner per architecture. Emulating aarch64 would make the
    # dnf step unreasonably slow, and free arm64 runners are available to
    # public repositories.
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: toolbx
            image: developer-platform-dev
            arch: amd64
            runner: ubuntu-24.04
          - flavor: toolbx
            image: developer-platform-dev
            arch: arm64
            runner: ubuntu-24.04-arm
          - flavor: distrobox
            image: developer-platform-distrobox
            arch: amd64
            runner: ubuntu-24.04
          - flavor: distrobox
            image: developer-platform-distrobox
            arch: arm64
            runner: ubuntu-24.04-arm

    name: build (${{ matrix.flavor }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Set image name
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${OWNER}/${{ matrix.image }}" >> "$GITHUB_ENV"

      # Build and smoke test in one step: build.sh checks the toolbx label on
      # the result and then runs tests/smoke-container.sh inside it.
      - name: Build and smoke test
        run: |
          containers/build.sh \
            --engine podman \
            --flavor "${{ matrix.flavor }}" \
            --arch "${{ matrix.arch }}" \
            --tag "$IMAGE:${GITHUB_SHA}-${{ matrix.arch }}" \
            --smoke

      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" |
            podman login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Publish architecture image
        if: github.event_name != 'pull_request'
        run: |
          podman push "$IMAGE:${GITHUB_SHA}-${{ matrix.arch }}"

  manifest:
    # Joins the per-architecture images published above into one multi-arch
    # manifest per flavour, so `podman pull` picks the right one.
    name: publish manifest (${{ matrix.flavor }})
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: toolbx
            image: developer-platform-dev
          - flavor: distrobox
            image: developer-platform-distrobox

    permissions:
      contents: read
      packages: write

    steps:
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Set image name
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${OWNER}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" |
            podman login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Assemble manifest
        run: |
          podman manifest create "$IMAGE:${GITHUB_SHA}"

          for arch in amd64 arm64; do
            podman manifest add \
              "$IMAGE:${GITHUB_SHA}" \
              "docker://$IMAGE:${GITHUB_SHA}-${arch}"
          done

      - name: Publish
        run: |
          podman manifest push --all \
            "$IMAGE:${GITHUB_SHA}" "docker://$IMAGE:${GITHUB_SHA}"

          podman manifest push --all \
            "$IMAGE:${GITHUB_SHA}" "docker://$IMAGE:main"
