# The image flavours, one per line. This is the single source of truth:
# containers/build.sh, scripts/validate.sh, tests/smoke-container.sh and
# .github/workflows/dev-image.yml all read it, so adding a flavour here is
# most of the work of adding a flavour.
#
#   name | package lists | published image | architectures | kind
#
# package lists   names under containers/packages/, without the .txt, in
#                 install order. A flavour that does not list `common` does
#                 not get the developer toolchain.
# architectures   what CI builds. ticrypt is amd64 only because upstream
#                 publishes no arm64 Linux build.
# kind            dev = also install VS Code, kubectl, argocd and ot.
#                 app = just the package lists and the flavour's own payload.
#
# Blank lines and '#' comments are ignored.

toolbx|common toolbx|developer-platform-dev|amd64 arm64|dev
distrobox|common distrobox|developer-platform-distrobox|amd64 arm64|dev
ticrypt|distrobox ticrypt|developer-platform-ticrypt|amd64|app
